name: Temporary connection parameter fix

on:
  push:
    branches:
      - fix/saas-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saas-hardening
          fetch-depth: 0
      - run: python .github/scripts/fix_connection_param_order.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/fix_connection_param_order.py
          rm .github/workflows/_temporary_fix_connection_params.yml
          git add src/app/api/whatsapp/webhook/route.ts .github/scripts/fix_connection_param_order.py .github/workflows/_temporary_fix_connection_params.yml
          git commit -m "fix(channels): require exact connection after channel"
          git push origin HEAD:fix/saas-hardening
