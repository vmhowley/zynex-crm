name: Temporary refresh npm lockfile

on:
  push:
    branches:
      - fix/saas-hardening

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saas-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_temporary_refresh_lockfile.yml
          git add package-lock.json .github/workflows/_temporary_refresh_lockfile.yml
          git commit -m "chore: sync npm lockfile" || true
          git push origin HEAD:fix/saas-hardening
