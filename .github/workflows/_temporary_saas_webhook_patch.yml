name: Temporary SaaS webhook patch

on:
  push:
    branches:
      - fix/saas-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saas-hardening
          fetch-depth: 0

      - name: Apply connection-aware webhook patch
        run: python .github/scripts/apply_saas_webhook_patch.py

      - name: Verify patch markers
        run: |
          grep -q "channel_config_id: channelConfigId" src/app/api/whatsapp/webhook/route.ts
          grep -q "handleStatusUpdate(status, resolvedForEvent?.config.id" src/app/api/whatsapp/webhook/route.ts
          grep -q ".eq('channel_config_id', channelConfigId)" src/app/api/whatsapp/webhook/route.ts

      - name: Commit patched webhook and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/_temporary_saas_webhook_patch.yml
          rm .github/scripts/apply_saas_webhook_patch.py
          git add src/app/api/whatsapp/webhook/route.ts .github/workflows/_temporary_saas_webhook_patch.yml .github/scripts/apply_saas_webhook_patch.py
          git commit -m "feat(channels): preserve inbound connection identity"
          git push origin HEAD:fix/saas-hardening
