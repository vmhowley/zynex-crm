name: Temporary lint error cleanup

on:
  push:
    branches:
      - fix/saas-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saas-hardening
          fetch-depth: 0
      - run: python .github/scripts/fix_lint_errors.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/fix_lint_errors.py
          rm .github/workflows/_temporary_fix_lint_errors.yml
          git add .
          git commit -m "fix: resolve blocking lint errors"
          git push origin HEAD:fix/saas-hardening
